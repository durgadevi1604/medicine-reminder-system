<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Medicine - Medicine Reminder System</title>

    <link rel="stylesheet" href="style.css">

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>


<body>

<header class="top-header">

    <div class="logo-section">

        <div class="logo">
            💊
        </div>

        <div>
            <h1>Medicine Reminder System</h1>
            <p>Using QR Code</p>
        </div>

    </div>

</header>


<div class="add-medicine-page">

    <div class="add-medicine-card">

        <div class="add-title">

            <div class="add-title-icon">
                💊
            </div>

            <div>
                <h2>Add New Medicine</h2>
                <p>Set your medicine reminder</p>
            </div>

        </div>


        <!-- MEDICINE NAME -->

        <label for="medicine">
            Medicine Name
        </label>

        <input
            type="text"
            id="medicine"
            placeholder="Enter medicine name"
        >


        <!-- DOSAGE -->

        <label for="dosage">
            Dosage
        </label>

        <input
            type="text"
            id="dosage"
            placeholder="Example: 500 mg"
        >


        <!-- REMINDER TIME -->

        <label for="time">
            Reminder Time
        </label>

        <input
            type="time"
            id="time"
        >


        <!-- START DATE -->

        <label for="start">
            Start Date
        </label>

        <input
            type="date"
            id="start"
        >


        <!-- MEDICINE TYPE -->

        <label for="medicineType">
            Medicine Type
        </label>

        <select id="medicineType">

            <option value="short-term">
                Short-Term Medicine
            </option>

            <option value="lifelong">
                Lifelong Medicine
            </option>

        </select>


        <!-- END DATE -->

        <label for="end">
            End Date
        </label>

        <input
            type="date"
            id="end"
        >


        <!-- SAVE BUTTON -->

        <button
            type="button"
            class="medicine-save-btn"
            id="saveMedicineBtn">

            🔔 Save Medicine Reminder

        </button>


        <!-- QR CODE -->

        <div id="qrcode"></div>


        <!-- VIEW MEDICINES -->

        <button
            type="button"
            class="view-medicine-btn"
            onclick="window.location.href='medicine-list.html'">

            💊 View My Medicines

        </button>


        <!-- BACK -->

        <button
            type="button"
            class="back-btn"
            onclick="window.location.href='index.html'">

            ← Back to Dashboard

        </button>

    </div>

</div>


<script>

/* ==================================================
   RAILWAY BACKEND
   ================================================== */

const API_URL =
    "https://medicine-reminder-system-production-3a18.up.railway.app";


/* ==================================================
   PAGE LOAD
   ================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const button =
            document.getElementById(
                "saveMedicineBtn"
            );

        if (button) {

            button.addEventListener(
                "click",
                saveMedicine
            );

        }

    }
);


/* ==================================================
   SAVE MEDICINE
   ================================================== */

async function saveMedicine() {

    const button =
        document.getElementById(
            "saveMedicineBtn"
        );


    /* ==============================================
       LOGIN CHECK
       ============================================== */

    const username =
        localStorage.getItem(
            "loggedInUser"
        );


    if (!username) {

        alert(
            "Please login first."
        );

        window.location.href =
            "login.html";

        return;
    }


    /* ==============================================
       GET FORM VALUES
       ============================================== */

    const medicineElement =
        document.getElementById(
            "medicine"
        );

    const dosageElement =
        document.getElementById(
            "dosage"
        );

    const timeElement =
        document.getElementById(
            "time"
        );

    const startElement =
        document.getElementById(
            "start"
        );

    const endElement =
        document.getElementById(
            "end"
        );

    const medicineTypeElement =
        document.getElementById(
            "medicineType"
        );


    if (
        !medicineElement ||
        !dosageElement ||
        !timeElement ||
        !startElement ||
        !endElement ||
        !medicineTypeElement
    ) {

        alert(
            "❌ Form fields not found."
        );

        return;
    }


    const medicine =
        medicineElement.value.trim();

    const dosage =
        dosageElement.value.trim();

    const time =
        timeElement.value;

    const start =
        startElement.value;

    let end =
        endElement.value;

    const medicineType =
        medicineTypeElement.value;


    /* ==============================================
       REQUIRED VALIDATION
       ============================================== */

    if (!medicine) {

        alert(
            "Please enter Medicine Name."
        );

        return;
    }


    if (!dosage) {

        alert(
            "Please enter Dosage."
        );

        return;
    }


    if (!time) {

        alert(
            "Please select Reminder Time."
        );

        return;
    }


    if (!start) {

        alert(
            "Please select Start Date."
        );

        return;
    }


    if (!medicineType) {

        alert(
            "Please select Medicine Type."
        );

        return;
    }


    /* ==============================================
       SHORT-TERM MEDICINE
       ============================================== */

    if (
        medicineType === "short-term" &&
        !end
    ) {

        alert(
            "Please select the End Date."
        );

        return;
    }


    /* ==============================================
       LIFELONG MEDICINE
       ============================================== */

    if (
        medicineType === "lifelong"
    ) {

        end =
            "9999-12-31";

    }


    /* ==============================================
       DATE VALIDATION
       ============================================== */

    if (
        medicineType === "short-term" &&
        end < start
    ) {

        alert(
            "End Date cannot be before Start Date."
        );

        return;
    }


    /* ==============================================
       REMINDER RULE

       MORE THAN 7 DAYS = REMINDER
       7 DAYS OR LESS   = NO REMINDER
       LIFELONG         = REMINDER
       ============================================== */

    let reminderStatus =
        "NOT REQUIRED";


    if (
        medicineType === "lifelong"
    ) {

        reminderStatus =
            "ENABLED";

    }

    else {

        const startDate =
            new Date(start);

        const endDate =
            new Date(end);

        const difference =
            endDate - startDate;

        const totalDays =
            Math.ceil(
                difference /
                (1000 * 60 * 60 * 24)
            );


        if (
            totalDays > 7
        ) {

            reminderStatus =
                "ENABLED";

        }

        else {

            reminderStatus =
                "NOT REQUIRED";

        }

    }


    /* ==============================================
       MEDICINE DATA
       ============================================== */

    const medicineData = {

        username:
            username,

        medicine:
            medicine,

        dosage:
            dosage,

        time:
            time,

        start:
            start,

        end:
            end,

        medicineType:
            medicineType,

        reminderStatus:
            reminderStatus

    };


    console.log(
        "📤 Sending medicine to Railway:",
        medicineData
    );


    /* ==============================================
       BUTTON LOADING
       ============================================== */

    if (button) {

        button.disabled =
            true;

        button.innerText =
            "⏳ Saving...";

    }


    let controller =
        null;

    let timeoutId =
        null;


    try {

        /* ==========================================
           ABORT CONTROLLER
           ========================================== */

        controller =
            new AbortController();


        timeoutId =
            setTimeout(
                function () {

                    controller.abort();

                },
                15000
            );


        /* ==========================================
           SEND TO RAILWAY
           ========================================== */

        const response =
            await fetch(
                `${API_URL}/api/medicines`,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            medicineData
                        ),

                    signal:
                        controller.signal

                }
            );


        clearTimeout(
            timeoutId
        );

        timeoutId =
            null;


        console.log(
            "📡 Railway Backend status:",
            response.status
        );


        /* ==========================================
           READ RESPONSE
           ========================================== */

        const result =
            await response.json();


        console.log(
            "📥 Railway Backend response:",
            result
        );


        /* ==========================================
           BACKEND ERROR
           ========================================== */

        if (!response.ok) {

            throw new Error(

                result.error ||
                result.message ||
                "Failed to save medicine."

            );

        }


        /* ==========================================
           LOCAL STORAGE
           ========================================== */

        let medicines = [];


        try {

            medicines =
                JSON.parse(
                    localStorage.getItem(
                        "medicines"
                    )
                ) || [];

        }

        catch {

            medicines = [];

        }


        medicines.push(
            medicineData
        );


        localStorage.setItem(
            "medicines",
            JSON.stringify(
                medicines
            )
        );


        localStorage.setItem(
            "medicineData",
            JSON.stringify(
                medicineData
            )
        );


        /* ==========================================
           GENERATE QR CODE
           ========================================== */

        const qr =
            document.getElementById(
                "qrcode"
            );


        if (qr) {

            qr.innerHTML =
                "";


            if (
                typeof QRCode !==
                "undefined"
            ) {

                new QRCode(
                    qr,
                    {

                        text:
                            JSON.stringify(
                                medicineData
                            ),

                        width:
                            180,

                        height:
                            180

                    }
                );

            }

        }


        /* ==========================================
           SUCCESS
           ========================================== */

        alert(

            "✅ MEDICINE SAVED SUCCESSFULLY!\n\n" +

            "Medicine: " +
            medicine +
            "\n" +

            "Dosage: " +
            dosage +
            "\n" +

            "Time: " +
            time +
            "\n\n" +

            "✅ Railway Backend Connected\n" +

            "✅ MySQL Database Saved\n" +

            "✅ QR Code Generated\n\n" +

            "Reminder: " +
            reminderStatus

        );


    }

    catch (error) {

        console.error(
            "❌ Save Error:",
            error
        );


        /* ==========================================
           TIMEOUT
           ========================================== */

        if (
            error.name ===
            "AbortError"
        ) {

            alert(

                "❌ Railway backend response timed out.\n\n" +

                "Please check Railway deployment."

            );

        }


        /* ==========================================
           FETCH / CORS ERROR
           ========================================== */

        else if (
            error instanceof TypeError
        ) {

            alert(

                "❌ Failed to connect to Railway backend.\n\n" +

                "Backend URL:\n" +

                API_URL +

                "\n\n" +

                "Please refresh the page and try again."

            );

        }


        /* ==========================================
           OTHER ERROR
           ========================================== */

        else {

            alert(

                "❌ Medicine could not be saved.\n\n" +

                "Error: " +
                error.message

            );

        }

    }


    /* ==============================================
       RESET BUTTON
       ============================================== */

    finally {

        if (timeoutId) {

            clearTimeout(
                timeoutId
            );

        }


        if (button) {

            button.disabled =
                false;

            button.innerText =
                "🔔 Save Medicine Reminder";

        }

    }

}

</script>


</body>

</html>
