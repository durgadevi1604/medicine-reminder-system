<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .register-link {
            text-align: center;
            margin-top: 18px;
        }

        .register-link a {
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Patient Login</h2>

    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Example: priya16@">

    <label for="password">Password</label>
    <input type="password"
           id="password"
           maxlength="5"
           inputmode="numeric"
           placeholder="Enter 5 digit password">

    <button onclick="login()">Login</button>

    <div class="register-link">
        Don't have an account?
        <a href="register.html">Create Account</a>
    </div>

</div>

<script>

function login() {

    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value;

    // Get registered account
    let savedUsername = localStorage.getItem("patientUsername");
    let savedPassword = localStorage.getItem("patientPassword");

    // No account
    if (!savedUsername || !savedPassword) {
        alert("No account found. Please create an account first.");
        return;
    }

    // Username check
    if (username !== savedUsername) {
        alert("Invalid Username.");
        return;
    }

    // Password check
    if (password !== savedPassword) {
        alert("Invalid Password.");
        return;
    }

    // Save logged-in user
    localStorage.setItem("loggedInUser", savedUsername);

    alert("Login Successful!");

    window.location.href = "index.html";
}

</script>

</body>
</html>
