<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - Medicine Reminder</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-box {
            width: 380px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .hint {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 5px;
            min-height: 18px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h2>Patient Registration</h2>

        <label for="username">Create Username</label>

        <input
            type="text"
            id="username"
            maxlength="10"
            placeholder="Example: Anu@12"
            oninput="validateUsername()"
        >

        <div class="hint">
            Maximum 10 characters. Use letters, numbers and a special character.
        </div>

        <div id="usernameError" class="error"></div>


        <label for="password">Create Password</label>

        <input
            type="password"
            id="password"
            maxlength="5"
            inputmode="numeric"
            placeholder="Enter 5 numbers"
            oninput="validatePassword()"
        >

        <div class="hint">
            Password must contain exactly 5 numbers.
        </div>

        <div id="passwordError" class="error"></div>


        <button type="button" onclick="register()">
            Create Account
        </button>


        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

    <script src="register.js"></script>

</body>
</html>
