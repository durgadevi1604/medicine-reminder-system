<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Medicine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-header">
    <div class="logo-section">
        <div class="logo">💊</div>

        <div>
            <h1>Medicine Reminder System</h1>
            <p>Edit Medicine</p>
        </div>
    </div>
</header>


<div class="container">

    <h2>✏️ Edit Medicine</h2>

    <label>Medicine Name</label>
    <input type="text" id="medicine">

    <label>Dosage</label>
    <input type="text" id="dosage">

    <label>Reminder Time</label>
    <input type="time" id="time">

    <label>Start Date</label>
    <input type="date" id="start">

    <label>End Date</label>
    <input type="date" id="end">

    <br><br>

    <button onclick="updateMedicine()">
        💾 Update Medicine
    </button>

    <button onclick="window.location.href='medicine-list.html'">
        ← Back
    </button>

</div>


<script src="edit-medicine.js"></script>

</body>
</html>
