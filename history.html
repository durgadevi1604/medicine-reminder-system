<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medicine History</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <header class="top-header">

        <div class="logo-area">
            💊
            <span>Medicine Reminder System</span>
        </div>

        <div class="profile-area">
            👩🏻
            <span id="patientName">Patient</span>
        </div>

    </header>


    <!-- ============================= -->
    <!-- MAIN CONTENT -->
    <!-- ============================= -->

    <main class="history-container">

        <div class="history-header">

            <div>
                <h1>📜 Medicine History</h1>

                <p>
                    View your medicine reminder history
                </p>
            </div>

            <button
                class="back-btn"
                onclick="goBack()">
                ← Back
            </button>

        </div>


        <!-- ============================= -->
        <!-- SUMMARY CARDS -->
        <!-- ============================= -->

        <div class="history-summary">

            <div class="history-summary-card">
                <div class="summary-icon">💊</div>

                <h3>Total</h3>

                <p id="totalCount">
                    0
                </p>
            </div>


            <div class="history-summary-card">
                <div class="summary-icon">✅</div>

                <h3>Taken</h3>

                <p id="takenCount">
                    0
                </p>
            </div>


            <div class="history-summary-card">
                <div class="summary-icon">❌</div>

                <h3>Missed</h3>

                <p id="missedCount">
                    0
                </p>
            </div>


            <div class="history-summary-card">
                <div class="summary-icon">⏳</div>

                <h3>Snoozed</h3>

                <p id="snoozedCount">
                    0
                </p>
            </div>

        </div>


        <!-- ============================= -->
        <!-- FILTER -->
        <!-- ============================= -->

        <div class="history-filter">

            <label for="statusFilter">
                Filter:
            </label>

            <select id="statusFilter">

                <option value="All">
                    All
                </option>

                <option value="Taken">
                    Taken
                </option>

                <option value="Missed">
                    Missed
                </option>

                <option value="Snoozed">
                    Snoozed
                </option>

            </select>

        </div>


        <!-- ============================= -->
        <!-- HISTORY TABLE -->
        <!-- ============================= -->

        <div class="history-table-container">

            <table>

                <thead>

                    <tr>

                        <th>Medicine</th>

                        <th>Dosage</th>

                        <th>Reminder Time</th>

                        <th>Status</th>

                        <th>Date</th>

                        <th>Time</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="historyTableBody">

                    <tr>

                        <td
                            colspan="7"
                            class="loading">
                            Loading history...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


        <!-- ============================= -->
        <!-- EMPTY MESSAGE -->
        <!-- ============================= -->

        <div
            id="emptyMessage"
            class="empty-message"
            style="display:none;">

            <div class="empty-icon">
                📋
            </div>

            <h2>
                No Medicine History
            </h2>

            <p>
                Your medicine activity will appear here.
            </p>

        </div>

    </main>


    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script src="history.js"></script>

</body>

</html>
